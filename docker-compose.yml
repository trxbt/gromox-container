name: grommunio

networks:
  grommunio:
    driver: bridge
  coolify:
    external: true

volumes:
  gromox_services:
  cert_data:
  gromox_mysql_data:
  chat_mysql_data:
  files_mysql_data:
  office_mysql_data:
  archive_mysql_data:
  grommunio_admin_api:
  grommunio_antispam:
  grommunio_dav:
  grommunio_web:
  opensuse_data:
  gromox:
  gromox_config:
  variables_data:
  gromox_letsencrypt:

services:
  gromox-db:
    image: mariadb:10
    container_name: gromox-db
    environment:
      MARIADB_ROOT_PASSWORD: GrommunioRoot2026!
      MARIADB_DATABASE: grommunio
      MARIADB_USER: grommunio
      MARIADB_PASSWORD: GrommunioDb2026!
    volumes:
      - gromox_mysql_data:/var/lib/mysql
    restart: on-failure
    healthcheck:
      test: mariadb --host=localhost --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} -e 'SELECT 1;'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - gromox-db

  chat-db:
    image: mariadb:10
    container_name: chat-db
    environment:
      MARIADB_ROOT_PASSWORD: GrommunioRoot2026!
      MARIADB_DATABASE: grochat
      MARIADB_USER: grochat
      MARIADB_PASSWORD: grommunio
    volumes:
      - chat_mysql_data:/var/lib/mysql
    restart: on-failure
    healthcheck:
      test: mariadb --host=localhost --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} -e 'SELECT 1;'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - chat-db

  files-db:
    image: mariadb:10
    container_name: files-db
    environment:
      MARIADB_ROOT_PASSWORD: GrommunioRoot2026!
      MARIADB_DATABASE: grofiles
      MARIADB_USER: grofiles
      MARIADB_PASSWORD: grommunio
    volumes:
      - files_mysql_data:/var/lib/mysql
    restart: on-failure
    healthcheck:
      test: mariadb --host=localhost --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} -e 'SELECT 1;'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - files-db

  office-db:
    image: mariadb:10
    container_name: office-db
    environment:
      MARIADB_ROOT_PASSWORD: GrommunioRoot2026!
      MARIADB_DATABASE: groffice
      MARIADB_USER: groffice
      MARIADB_PASSWORD: grommunio
    volumes:
      - office_mysql_data:/var/lib/mysql
    restart: on-failure
    healthcheck:
      test: mariadb --host=localhost --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} -e 'SELECT 1;'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - office-db

  archive-db:
    image: mariadb:10
    container_name: archive-db
    environment:
      MARIADB_ROOT_PASSWORD: GrommunioRoot2026!
      MARIADB_DATABASE: groarchive
      MARIADB_USER: groarchive
      MARIADB_PASSWORD: grommunio
    volumes:
      - archive_mysql_data:/var/lib/mysql
    restart: on-failure
    healthcheck:
      test: mariadb --host=localhost --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} -e 'SELECT 1;'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - archive-db

  gromox-core:
    build:
      context: ./
      dockerfile: ./gromox-core/Dockerfile
    restart: on-failure
    volumes:
      - opensuse_data:/data
      - variables_data:/home/vars
      - cert_data:/etc/grommunio-common/ssl
      - gromox_services:/home/gromox-services
      - grommunio_admin_api:/var/lib/grommunio-admin-api
      - grommunio_antispam:/var/lib/grommunio-antispam
      - grommunio_dav:/var/lib/grommunio-dav
      - grommunio_web:/var/lib/grommunio-web
      - gromox:/var/lib/gromox
      - gromox_config:/etc/gromox
      - gromox_letsencrypt:/etc/letsencrypt
    ports:
      - "25:2525"    # SMTP   (postfix remapped to 2525 by docker-entrypoint.sh)
      - "465:2465"   # SMTPS  (postfix)
      - "587:2587"   # SMTP Submission (postfix)
      - "993:2993"   # IMAPS  (gromox imap)
      - "995:2995"   # POP3S  (gromox pop3)
      - "110:2110"   # POP3   (gromox pop3)
      - "143:2143"   # IMAP   (gromox imap)
      - "9443:9443"  # Admin panel HTTPS (direct, bypasses Traefik)
    expose:
      - "8080"       # nginx HTTP  (web, used by Coolify Traefik)
      - "8443"       # nginx HTTPS (web, after 443→8443 remap)
      - "9080"       # nginx HTTP  (admin panel, after 8080→9080 remap)
      - "9443"       # nginx HTTPS (admin panel, after 8443→9443 remap)
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - gromox-core
      coolify:
    environment:
      container: docker
      MYSQL_ROOT_PASS: GrommunioRoot2026!
      MYSQL_HOST: gromox-db
      MYSQL_USER: grommunio
      MYSQL_PASS: GrommunioDb2026!
      MYSQL_DB: grommunio
      CHAT_MYSQL_ROOT_PASS: GrommunioRoot2026!
      CHAT_MYSQL_HOST: chat-db
      CHAT_MYSQL_USER: grochat
      CHAT_MYSQL_PASS: grommunio
      CHAT_MYSQL_DB: grochat
      FILES_MYSQL_ROOT_PASS: GrommunioRoot2026!
      FILES_MYSQL_HOST: files-db
      FILES_MYSQL_USER: grofiles
      FILES_MYSQL_PASS: grommunio
      FILES_MYSQL_DB: grofiles
      OFFICE_MYSQL_ROOT_PASS: GrommunioRoot2026!
      OFFICE_MYSQL_HOST: office-db
      OFFICE_MYSQL_USER: groffice
      OFFICE_MYSQL_PASS: grommunio
      OFFICE_MYSQL_DB: groffice
      ARCHIVE_MYSQL_ROOT_PASS: GrommunioRoot2026!
      ARCHIVE_MYSQL_HOST: archive-db
      ARCHIVE_MYSQL_USER: groarchive
      ARCHIVE_MYSQL_PASS: grommunio
      ARCHIVE_MYSQL_DB: groarchive
      ADMIN_PASS: "Kanxpc192955*"
      CHAT_ADMIN_PASS: "Kanxpc192955*"
      FILES_ADMIN_PASS: "Kanxpc192955*"
      FQDN: mxhost.tr
      ORIGFQDN: mxhost.tr
      DOMAIN: mxhost.tr
      ORIGDOMAIN: mxhost.tr
      ORGANIZATION: mxhost
      TIMEZONE: Europe/Istanbul
      RELAYHOST: ""
      SSL_INSTALL_TYPE: "0"
      SSL_EMAIL: admin@mxhost.tr
      ENABLE_ARCHIVE: "false"
      ENABLE_OFFICE: "false"
      ENABLE_FILES: "false"
      CLEAR_DBS: "true"
      LOGFILE: /var/log/grommunio-setup.log
      CHAT_CONFIG: /etc/grommunio-chat/config.json
    depends_on:
      gromox-db:
        condition: service_healthy
      chat-db:
        condition: service_healthy
      files-db:
        condition: service_healthy
      office-db:
        condition: service_healthy
      archive-db:
        condition: service_healthy

  gromox-archive:
    build:
      context: ./
      dockerfile: ./gromox-archive/Dockerfile
    restart: on-failure
    volumes:
      - opensuse_data:/data
      - variables_data:/home/vars
      - cert_data:/etc/grommunio-common/ssl
    expose:
      - "8443"   # HTTPS (nginx)
      - "2693"   # Archive SMTP
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - gromox-archive
    environment:
      ENABLE_ARCHIVE: "false"
      FQDN: mxhost.tr
      DOMAIN: mxhost.tr
      LOGFILE: /var/log/grommunio-setup.log
      SSL_INSTALL_TYPE: "0"
      ARCHIVE_MYSQL_HOST: archive-db
      ARCHIVE_MYSQL_USER: groarchive
      ARCHIVE_MYSQL_PASS: grommunio
      ARCHIVE_MYSQL_DB: groarchive
    depends_on:
      gromox-db:
        condition: service_healthy
      archive-db:
        condition: service_healthy
      gromox-core:
        condition: service_started

  gromox-office:
    build:
      context: ./
      dockerfile: ./gromox-office/Dockerfile
    restart: on-failure
    volumes:
      - opensuse_data:/data
      - variables_data:/home/vars
      - cert_data:/etc/grommunio-common/ssl
    dns:
      - 127.0.0.11
      - 8.8.8.8
    networks:
      grommunio:
        aliases:
          - gromox-office
    environment:
      ENABLE_OFFICE: "false"
      ENABLE_FILES: "false"
      FQDN: mxhost.tr
      DOMAIN: mxhost.tr
      LOGFILE: /var/log/grommunio-setup.log
      SSL_INSTALL_TYPE: "0"
    depends_on:
      gromox-db:
        condition: service_healthy
      files-db:
        condition: service_healthy
      office-db:
        condition: service_healthy
      gromox-core:
        condition: service_started
